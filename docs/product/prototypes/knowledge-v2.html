nt-size:13px}th{font-weight:500;color:var(--muted);background:#f8fafd}th,td{padding:14px 12px;border-bottom:1px solid #edf1f7}td .small{margin-top:4px}.notice{padding:13px 16px;border-radius:12px;background:#eef5ff;color:var(--dark);font-size:13px;margin-bottom:18px}.notice.warn{background:#fff6e5;color:var(--warn)}.notice.danger{background:#fceef1;color:var(--red)}.empty{text-align:center;padding:75px 22px}.empty-symbol{font-size:34px;color:var(--primary);margin-bottom:14px}.quote{border-left:3px solid var(--cyan);background:#f0f8fc;border-radius:0 10px 10px 0;padding:14px 16px;margin:14px 0}.progress{height:6px;background:#e8eef7;border-radius:9px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:var(--primary);width:68%}.step{display:flex;gap:12px;padding:14px 0}.step-number{flex:none;width:28px;height:28px;background:#eaf2ff;color:var(--primary);border-radius:50%;display:grid;place-items:center;font-size:12px}.dropzone{border:1.5px dashed #b4cbea;background:#f7faff;border-radius:15px;padding:28px;text-align:center;margin:20px 0}.dropzone input{max-width:100%;margin:15px 0}.review-grid{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(260px,1.5fr) minmax(230px,1fr);gap:16px}.fragment{padding:14px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.fragment.accepted{border-color:#7ca7e6;background:#f5f9ff}.article p{line-height:1.9}.citation{padding:0 6px;min-height:30px;color:var(--primary);background:#edf4ff;border:0}.check{padding:9px 0;font-size:13px}.check::before{content:'✓';color:var(--primary);margin-right:9px}.check.blocked::before{content:'!';color:var(--warn)}.fixed-actions{margin-top:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.mono{font-family:ui-monospace,monospace;overflow-wrap:anywhere;font-size:11px;color:var(--muted)}dialog{width:min(610px,calc(100% - 32px));max-height:90vh;border:1px solid var(--line);border-radius:20px;padding:26px;color:var(--ink);box-shadow:0 30 'use strict';

const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state={page:'graph',role:'reader',scenario:'normal',space:'all',query:'',zoom:1,sourceLayer:false,conceptLayer:true,focus:null,accepted:false,submitted:false,approved:false,changed:false,conflict:false,importStep:0,importName:'示例员工手册.pdf',askState:'idle',tab:'queue',sourcesValid:true};
const nodes=[{id:'leave',x:310,y:220,r:34,label:'年假与休假',kind:'entry',space:'hr'},{id:'attendance',x:170,y:135,r:25,label:'考勤管理',kind:'entry',space:'hr'},{id:'onboard',x:180,y:320,r:23,label:'新员工入职',kind:'entry',space:'hr'},{id:'expense',x:540,y:175,r:27,label:'差旅报销',kind:'entry',space:'ops'},{id:'travel',x:590,y:325,r:23,label:'出差申请',kind:'entry',space:'ops'},{id:'hr',x:385,y:95,r:18,label:'员工权益',kind:'concept',space:'hr'},{id:'finance',x:435,y:340,r:18,label:'费用管理',kind:'concept',space:'ops'},{id:'handbook',x:90,y:245,r:15,label:'员工手册',kind:'source',space:'hr'},{id:'policy',x:675,y:220,r:15,label:'差旅规范',kind:'source',space:'ops'}];
const edges=[['leave','attendance','相关'],['leave','onboard','相关'],['leave','hr','属于'],['attendance','hr','属于'],['expense','finance','属于'],['travel','finance','属于'],['expense','travel','相关'],['leave','expense','相关'],['handbook','leave','依据'],['handbook','attendance','依据'],['policy','expense','依据']];
function head(k,title,sub,action=''){return `<div class="page-head"><div><span class="eyebrow">${k}</span><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function badge(t,cls=''){return `<span class="chip ${cls}">${t}</span>`}
function preview(t){toast('设计预览：'+t+'。未执行业务操作。')}
let toastTimer,returnFocus;
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,5000)}
function navigate(page){location.hash=page}
function drawGraph(){let visible=nodes.filter(n=>(state.space==='all'||n.space===state.space)&&(state.sourceLayer||n.kind!=='source')&&(state.conceptLayer||n.kind!=='concept'));if(state.focus){const neighbors=new Set([state.focus]);edges.forEach(([a,b])=>{if(a===state.focus)neighbors.add(b);if(b===state.focus)neighbors.add(a)});visible=visible.filter(n=>neighbors.has(n.id))}const ids=new Set(visible.map(n=>n.id));return `<svg viewBox="0 0 760 440" role="group" aria-label="合成知识图谱，可用 Tab 选择节点"><g transform="translate(${380*(1-state.zoom)} ${220*(1-state.zoom)}) scale(${state.zoom})">${edges.filter(([a,b])=>ids.has(a)&&ids.has(b)).map(([a,b,l])=>{const A=nodes.find(n=>n.id===a),B=nodes.find(n=>n.id===b);return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}"/><text class="edge-name" x="${(A.x+B.x)/2}" y="${(A.y+B.y)/2-8}">${l}</text>`}).join('')}${visible.map(n=>`<g class="node" tabindex="0" role="button" aria-label="查看${n.label}" data-node="${n.id}"><circle cx="${n.x}" cy="${n.y}" r="${n.r}" fill="${n.kind==='concept'?'#00a6b8':n.kind==='source'?'#b5c1d4':n.space==='ops'?'#5686cf':'#0b57d0'}"/><text x="${n.x}" y="${n.y+n.r+22}">${n.label}</text></g>`).join('')}</g></svg>`}
function graph(){return head('KNOWLEDGE AT A GLANCE','连接知识，看清全景','从主题发现知识，沿着关系核验依据。',`<button data-action="graph-help">如何阅读图谱 ↗</button>`)+`<div class="statbar"><div class="stat"><strong>${state.space==='all'?5:state.space==='hr'?3:2}</strong><span>现行条目</span></div><div class="stat"><strong>${state.space==='all'?2:1}</strong><span>主题概念</span></div><div class="stat"><strong>${state.space==='all'?2:1}</strong><span>可见空间</span></div><span class="small">统计为合成样例，只描述当前可见集合</span></div><div class="grid two"><section class="card graph-card"><div class="graph-head"><div class="toolbar"><form class="search-form" data-form="graph-search"><input name="q" aria-label="搜索图谱节点" placeholder="搜索条目、主题或制度编号"><button type="submit">定位</button></form><button data-action="toggle-concepts" aria-pressed="${state.conceptLayer}">主题 ${state.conceptLayer?'开':'关'}</button><button data-action="toggle-sources" aria-pressed="${state.sourceLayer}">来源 ${state.sourceLayer?'开':'关'}</button></div>${state.focus?`<div class="notice">局部图谱 · 1 跳邻居 <button class="link-button" data-action="reset-graph">返回全景</button></div>`:''}</div><div class="graph">${drawGraph()}<div class="graph-controls"><button data-action="zoom-out" aria-label="缩小图谱">−</button><button data-action="reset-graph" aria-label="重置图谱">复位</button><button data-action="zoom-in" aria-label="放大图谱">＋</button><button data-action="graph-list">列表视图</button></div></div><div class="graph-foot"><div class="legend"><span><i class="dot"></i>知识条目</span><span><i class="dot concept"></i>概念</span><span><i class="dot source"></i>来源</span></div><span>当前发布快照 · 仅现行有效</span></div></section><aside class="grid"><section class="card"><span class="eyebrow">EXPLORE</span><h2 style="margin-top:10px">从一个问题开始</h2><p class="muted">不知道知识在哪里？先搜索，再沿引用找到原文。</p><button class="primary" data-go="search">搜索知识 →</button><div class="divider"></div><div class="list-item"><span class="small">人力资源制度 · 现行</span><br><button class="link-button" data-node="leave">年假与休假 →</button><p>假期天数、申请流程与适用范围</p></div><div class="list-item"><span class="small">运营规范 · 现行</span><br><button class="link-button" data-node="expense">差旅报销 →</button><p>出差审批、费用凭证与报销流程</p></div></section><div class="guide"><strong>先核验，再使用</strong><p class="small">每个已发布条目都有来源修订与定位。关系表示关联，不自动扩大可见权限。</p><a href="#ask">带着问题查依据 ↗</a></div></aside></div>`}
function search(){const q=state.query;const results=(!q||'年假休假员工制度'.includes(q)||q.includes('年假'))?[['年假与休假','员工手册 · 修订 r3 · 第 4 页 §2','年假申请应由员工提交，并由对应负责人按制度审核。'],['考勤管理','员工手册 · 修订 r3 · 第 6 页 §1','请假记录与考勤记录关联，具体适用条件以原文为准。']]:[];return head('FIND THE EVIDENCE','知识搜索','只搜索你有权访问的现行知识。')+`<section class="card"><form class="search-form" data-form="search"><input name="q" aria-label="搜索关键词" value="${esc(q)}" placeholder="输入关键词或制度编号"><button class="primary">搜索</button></form><div class="toolbar" style="margin-top:16px"><span class="chip gray">现行有效</span><span class="chip gray">当前空间范围</span><span class="small">${results.length} 条合成结果</span></div>${results.length?results.map(([t,s,b])=>`<article class="list-item"><div class="row between"><button class="link-button" data-go="read"><h2 style="margin:0">${t}</h2></button>${badge('现行')}</div><p>${b}</p><div class="small">${s} · 最近核验 2026-11-01</div><button class="link-button" data-action="citation">核验原文 ↗</button></article>`).join(''):`<div class="empty"><h2>没有找到匹配知识</h2><p class="muted">试试更短的关键词，或调整可见空间范围。</p><button data-action="clear-search">清除关键词</button></div>`}</section>`}
function read(){return head('VERIFIED KNOWLEDGE','年假与休假','人力资源制度 / 员工权益',badge('现行 · r4'))+`<div class="grid two"><article class="card article"><div class="notice">AI 整理，制度原文为准。本页内容为合成评审文案。</div><span class="small">生效 2026-11-01 · 最近核验 2026-11-01 · 来源修订 r3</span><h2 style="margin-top:24px">适用范围</h2><p>本条目用于说明员工休假申请的基本流程，具体适用条件应核验现行原文。<button class="citation" data-action="citation" aria-label="打开引用1">[1]</button></p><h2>申请流程</h2><p>员工提交休假申请后，由对应负责人依据制度进行审核。审批完成前，申请状态应保持为待确认。<button class="citation" data-action="citation" aria-label="打开引用2">[2]</button></p><div class="divider"></div><button data-go="ask">基于现行知识提问</button> <button data-action="feedback">反馈问题</button></article><aside class="card"><h2>依据与关联</h2><div class="quote">员工手册 · r3<br><span class="small">第 4 页 §2 · 片段 frag-demo-01</span><br><button class="link-button" data-action="citation">查看原文位置 ↗</button></div><h3>相关主题</h3><span class="chip">员工权益</span><h3 style="margin-top:22px">关联条目</h3><button class="link-button" data-node="attendance">考勤管理 ↗</button><div class="divider"></div><span class="small">原文、片段与历史版本都须重新验权。旧引用不恢复已撤销的权限。</span></aside></div>`}
function ask(){const panels={idle:'',running:`<div class="notice">任务进度预览：检索授权片段 → 生成有依据回答</div><div class="progress"><span></span></div><button data-action="ask-complete">查看完成态</button> <button data-action="ask-stop">停止跟随</button> <button data-action="ask-cancel">请求取消任务</button>`,done:`<div class="preview-label">合成答案 · 未调用模型</div><h2>休假申请需要经过审核</h2><p>根据示例员工手册，员工应提交申请，再由对应负责人依据制度审核。具体假期天数需结合适用条件核验，不能仅由本段文案推断。<button class="citation" data-action="citation">[1]</button></p><div class="quote">员工手册 r3 · 第 4 页 §2 <button class="link-button" data-action="citation">核验引用 ↗</button></div>`,none:`<div class="notice warn">当前可访问知识中未找到充分依据。请调整问题，或联系制度负责人。</div>`,conflict:`<div class="notice warn">发现依据冲突，暂不能给出统一结论。请由制度负责人确认适用关系。</div><div class="quote">合成来源 A：申请需提前提交。</div><div class="quote">合成来源 B：紧急情况可补交申请。</div>`,cancel:`<div class="notice">取消已请求 · 正等待服务端终态（原型预览）。不能将停止接收等同于任务已取消。</div><button data-action="ask-cancelled">查看已取消终态</button>`,cancelled:`<div class="notice">已取消（终态样式预览），保留问题便于再次提交。</div>`,stopped:`<div class="notice">已停止跟随。远端任务可能仍在运行，可到“我的任务”恢复跟随。</div><button data-go="tasks">查看我的任务</button>`};return head('ANSWERS WITH SOURCES','知识问答','答案必须有据可依，依据不足时明确告知。')+`<div class="grid two"><section class="card"><form data-form="ask"><label for="question">你的问题</label><textarea id="question" name="question" placeholder="例如：休假申请需要经过哪些步骤？">${esc(state.question||'休假申请需要经过哪些步骤？')}</textarea><div class="row between" style="margin-top:14px"><span class="small">公司统一模型 · 仅现行可见知识</span><button class="primary">预览问答进度</button></div></form><div class="divider"></div><div aria-live="polite">${panels[state.askState]}</div></section><aside class="card"><h2>评审回答状态</h2><p class="muted">切换以下状态，检查提示、引用和恢复路径。</p><button class="faq-chip" data-answer="done">有依据</button><button class="faq-chip" data-answer="none">无充分依据</button><button class="faq-chip" data-answer="conflict">依据冲突</button><div class="guide"><strong>来源失效时立即停用</strong><p class="small">撤回或撤权后不继续返回旧答案或引用；保留问题，提示重新检索。</p><button data-action="evidence-changed">预览依据失效</button></div></aside></div>`}

function review(){const canReview=state.role==='reviewer',canEdit=state.role==='editor';return head('REVIEW WORKBENCH','年假与休假 · 候选 r5','片段核验 → 条目组装 → 审校 → 独立发布',badge(state.submitted?'待发布':'待审校','amber'))+`<div class="notice ${state.changed?'warn':''}">${state.changed?'APPROVAL_EXPIRED：草稿或依据已变化，旧审校/审批失效，需重新提交。':'候选内容不影响现行 r4。默认审校人与发布人分离。'}</div><div class="review-grid"><section class="card"><h2>待审片段</h2><div class="fragment ${state.accepted?'accepted':''}"><div class="row between"><strong>申请流程</strong>${badge(state.accepted?'已采纳':'待核验',state.accepted?'':'amber')}</div><p>员工提交休假申请后，由对应负责人依据制度进行审核。</p><span class="small">员工手册 r3 · 第 4 页 §2</span><br><button class="link-button" data-action="citation">查看原文 ↗</button><div class="actions"><button data-action="accept-fragment" ${canReview?'':'disabled'}>${state.accepted?'撤销采纳预览':'采纳片段'}</button><button data-action="reject-fragment" ${canReview?'':'disabled'}>退回</button></div></div><p class="small">仅审校角色可采纳/退回。原型角色切换不代表实际授权。</p></section><section class="card article"><div class="row between"><h2>条目正文</h2>${badge('候选草稿','gray')}</div><label for="draft">正文（编辑角色可修改）</label><textarea id="draft" ${canEdit?'':'readonly'}>${esc(state.draft||'员工提交休假申请后，由对应负责人依据制度进行审核。[1]')}</textarea><div class="quote">[1] 员工手册 r3 / 第 4 页 §2 / frag-demo-01</div><h3>概念与关系</h3><span class="chip">员工权益</span><p class="small">相关 → 考勤管理 · 人工确认候选关系</p><button data-action="edit-draft" ${canEdit?'':'disabled'}>预览保存新修订</button><p class="small">编辑正文、引用或关系后须重新审校。</p></section><aside class="card"><h2>依据与发布检查</h2><div class="check ${state.accepted?'':'blocked'}">${state.accepted?'片段已核验':'片段尚未核验'}</div><div class="check">来源当前有效</div><div class="check">引用位于同一空间</div><div class="check">可见范围交集非空</div><div class="check ${state.changed?'blocked':''}">${state.changed?'旧审批已失效':'候选修订尚未改变'}</div><div class="divider"></div><h3>影响预览</h3><p class="small">1 个条目 · 1 个概念 · 1 条关系<br>发布后更新检索、问答及图谱</p><div class="mono">baseSnapshot: snap-demo-04<br>expectedRevision: 5<br>policyRevision: 2<br>graphHash: sha256:demo…（示意）</div></aside></div><div class="fixed-actions"><button data-go="publish">← 返回发布队列</button><div class="actions"><button data-action="version-conflict">预览并发冲突</button><button data-action="submit-review" ${canEdit?'':'disabled'}>提交审校</button><button class="primary" data-action="approve-review" ${canReview&&state.accepted?'':'disabled'}>审校通过 · 预览</button></div></div>`}

('#dialog').close();state.scenario='revoked';$('#scenario').value='revoked';render();break;case'contract':modal('版本化契约 · planned',`<p>API、CLI 与受限 MCP 复用业务服务和服务端授权。未实现能力不注册为 ready。</p><p class="mono">示例：knowledge.graph.query.v1<br>CLI：nuochong knowledge graph query --input - --json</p><p>完整页面/命令映射见相邻 prototype-design.md；输入输出 Schema 在 PLAN-02 冻结。</p>`);break;case'follow':preview('通过 jobs.get/events 恢复跟随当前任务');break;case'stop-follow':preview('停止本地跟随，远端任务继续运行');break;case'cancel-job':modal('取消任务 · 请求态',`<div class="notice">取消已请求（预览） · 等待服务端确认</div><p>请求成功不等于任务已取消；若任务已经完成，显示服务端实际终态。</p><button data-action="close-modal">返回任务</button>`);break;case'shared-access':modal('共享管理交接',`<p>组织目录与角色绑定由共享插件维护，三个产品不各建主库。</p><p>平台管理员不自动获得内容发布权；角色切换器仅为原型评审工具，不可进入正式产品。</p><p>完整共享管理页面沿用 v1 设计，后续独立验收。</p>`);break;case'empty-spaces':state.scenario='normal';$('#scenario').value='normal';navigate('spaces');render();break;case'reset-scenario':state.scenario='normal';$('#scenario').value='normal';render();break;}

document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();const data=new FormData(f);switch(f.dataset.form){case'graph-search':{const q=String(data.get('q')||'').trim();const n=nodes.find(n=>n.label.includes(q)&&q&&(state.space==='all'||n.space===state.space));if(n){state.focus=n.id;location.hash='graph?space='+state.space+'&focus='+n.id;nodeDetails(n.id)}else toast('未找到匹配的可见合成节点；可调整关键词或查看列表。');break}case'search':state.query=String(data.get('q')||'');location.hash='search?q='+encodeURIComponent(state.query);render();break;case'ask':state.question=String(data.get('question')||'');if(!state.question.trim()){toast('请输入问题');break}state.askState='running';render();break;case'space':$('#dialog').close();preview('创建申请校验编码、部门与权限，服务端审批后才创建空间');break;case'import-meta':state.importStep=2;importWizard();break;}});
document.addEventListener('change',e=>{if(e.target.id==='role'){closeDrawer();if($('#dialog').open)$('#dialog').close();state.role=e.target.value;state.approved=false;render()}if(e.target.id==='scenario'){closeDrawer();if($('#dialog').open)$('#dialog').close();if($('#draft'))state.draft=$('#draft').value;if($('#question'))state.question=$('#question').value;state.scenario=e.target.value;state.approved=false;render()}if(e.target.id==='spaceFilter'){closeDrawer();state.space=e.target.value;state.focus=null;if(state.page==='graph')location.hash='graph?space='+state.space;render()}if(e.target.id==='file'){const file=e.target.files[0];if(!file)return;if(!/\.(md|txt|pdf|docx)$/i.test(file.name)){toast('INVALID_INPUT：P1 仅接受 Markdown/TXT/文本层 PDF/DOCX。');e.target.value='';return}state.importName=file.name;state.importStep=1;importWizard()}});
document.addEventListener('keydown',e=>{const n=e.target.closest('[data-node]');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nodeDetails(n.dataset.node)}if(e.key==='Escape')closeDrawer();if(e.key==='Tab'&&!$('#drawer').hidden){const focusable=[...$('#drawer').querySelectorAll('button,a[href],input,select,textarea,[tabindex="0"]')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#drawer'))){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
$('#menu').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('open',open);$('#menu').setAttribute('aria-expanded',String(open))});$('#overlay').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('open');$('#menu').setAttribute('aria-expanded','false')});$('#dialog').addEventListener('close',()=>returnFocus?.focus());window.addEventListener('hashchange',()=>{closeDrawer();render();window.scrollTo(0,0);$('#content').focus()});render();
</script></body></html>
