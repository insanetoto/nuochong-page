name: OA-01 live service acceptance
on:
  push:
    branches: [feature/oa-01-closeout]
    paths: ['.github/workflows/oa-01-acceptance.yml', 'scripts/oa-01-service-probe.sh', 'scripts/verify-oa-unavailable.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oa-test-server-deploy
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Configure existing SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/oa_acceptance_key
          chmod 600 ~/.ssh/oa_acceptance_key
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Stop test Harness only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/oa_acceptance_key -o BatchMode=yes -o IdentitiesOnly=yes deploy@"$DEPLOY_HOST" "bash -s -- stop $GITHUB_RUN_ID" < scripts/oa-01-service-probe.sh
      - name: Verify website isolation and explicit unavailability
        run: node scripts/verify-oa-unavailable.mjs
      - name: Start and restart, verify native configuration and workspace persistence
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/oa_acceptance_key -o BatchMode=yes -o IdentitiesOnly=yes deploy@"$DEPLOY_HOST" "bash -s -- recover $GITHUB_RUN_ID" < scripts/oa-01-service-probe.sh | tee oa-01-runtime.json
      - name: Verify recovered native login and WebSocket with authorized temporary credential
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          launch_url=$(ssh -i ~/.ssh/oa_acceptance_key -o BatchMode=yes -o IdentitiesOnly=yes deploy@"$DEPLOY_HOST" 'cat "$HOME/.local/state/nuochong-oa-test/launch-url"')
          printf '::add-mask::%s\n' "$launch_url"
          export OA_PRIVATE_LAUNCH_URL="$launch_url"
          node --input-type=module -e 'for (const value of new URL(process.env.OA_PRIVATE_LAUNCH_URL).searchParams.values()) console.log("::add-mask::" + value)'
          node scripts/verify-oa-live.mjs | tee oa-01-live.json
      - name: Always restore service and remove synthetic files
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/oa_acceptance_key -o BatchMode=yes -o IdentitiesOnly=yes deploy@"$DEPLOY_HOST" "bash -s -- cleanup $GITHUB_RUN_ID" < scripts/oa-01-service-probe.sh
          rm -f ~/.ssh/oa_acceptance_key
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oa-01-acceptance-evidence
          path: oa-01-*.json
          if-no-files-found: ignore
