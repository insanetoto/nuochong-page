name: Durable jobs prototype

on:
  pull_request:
    branches: [refactor/integration]
    paths:
      - 'experiments/phase-a/jobs/**'
      - '.github/workflows/durable-jobs-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL lease and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: prototype
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: prototype
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prototype -d prototype"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: experiments/phase-a/jobs/package-lock.json
      - run: npm ci --prefix experiments/phase-a/jobs --ignore-scripts --no-audit --no-fund
      - name: Exercise real PostgreSQL concurrency and process crashes
        env:
          DATABASE_URL: postgresql://prototype:synthetic_ci_only@127.0.0.1:5432/prototype
        run: node experiments/phase-a/jobs/verify-jobs.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: durable-jobs-probe
          path: experiments/phase-a/jobs/outputs/*.json
          if-no-files-found: ignore
