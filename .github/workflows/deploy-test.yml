name: Deploy to Cloudflare (test)

on:
  workflow_dispatch:
  push:
    branches:
      - test

concurrency:
  group: test-cloudflare
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build vinext Worker
        run: npm run build

      - name: Set test worker name
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const path = 'dist/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.name = 'nuochong-company-homepage-test';
          config.vars ??= {};
          delete config.vars.NUOCHONG_OA_URL;
          const oa = 'https://www.nuochong.net/oa-test/';
          try {
            const response = await fetch(oa, { signal: AbortSignal.timeout(10000) });
            if (response.ok && /<title>DeepSeek Harness<\/title>/.test(await response.text())) {
              config.vars.NUOCHONG_OA_URL = oa;
              console.log('Verified native Harness home; enabling test /oa redirect.');
            } else console.log('Native OA administrator bootstrap not ready; /oa remains explicitly unavailable.');
          } catch { console.log('Native OA endpoint unavailable; /oa remains explicitly unavailable.'); }
          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          JS

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json

      - name: Check test homepage and assets
        run: node scripts/check-environment.mjs test
