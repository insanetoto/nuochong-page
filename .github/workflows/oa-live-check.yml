name: Verify live native OA
on:
  push:
    branches: [feature/oa-test-native-deploy]
    paths: ['.github/workflows/oa-live-check.yml', 'scripts/verify-oa-live.mjs']
  workflow_dispatch:
    inputs:
      website:
        description: 官网入口环境
        type: choice
        options: [test, production]
        default: test
      setup_account:
        description: 使用临时 Actions Secrets 初始化测试管理员账号
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # User explicitly authorized this server-to-Actions credential transfer on 2026-10-30.
      - name: Verify live login with a temporary masked credential
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          OA_ENTRY_SITE: ${{ inputs.website || 'test' }}
          OA_SETUP_ACCOUNT: ${{ inputs.setup_account || false }}
          OA_TEST_LOGIN_USER: ${{ secrets.OA_TEST_LOGIN_USER }}
          OA_TEST_LOGIN_PASSWORD: ${{ secrets.OA_TEST_LOGIN_PASSWORD }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/oa_live_key
          chmod 600 ~/.ssh/oa_live_key
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          if [ "$OA_SETUP_ACCOUNT" = "true" ]; then
            test -n "$OA_TEST_LOGIN_USER" && test -n "$OA_TEST_LOGIN_PASSWORD"
            node -e 'process.stdout.write(JSON.stringify({username:process.env.OA_TEST_LOGIN_USER,password:process.env.OA_TEST_LOGIN_PASSWORD}))' | ssh -i ~/.ssh/oa_live_key -o BatchMode=yes -o IdentitiesOnly=yes deploy@"$DEPLOY_HOST" 'NUOCHONG_OA_HOME="$HOME/.local/state/nuochong-oa-test" OA_LOGIN_VERIFY=1 "$HOME/.local/share/nuochong-oa-test/current/runtime/bin/node" "$HOME/.local/share/nuochong-oa-test/current/apps/oa/deploy/configure-login.mjs"'
          fi
          launch_url=$(ssh -i ~/.ssh/oa_live_key -o BatchMode=yes -o IdentitiesOnly=yes deploy@"$DEPLOY_HOST" 'cat "$HOME/.local/state/nuochong-oa-test/launch-url"')
          printf '::add-mask::%s\n' "$launch_url"
          export OA_PRIVATE_LAUNCH_URL="$launch_url"
          node --input-type=module -e 'for (const value of new URL(process.env.OA_PRIVATE_LAUNCH_URL).searchParams.values()) console.log("::add-mask::" + value)'
          case "$OA_ENTRY_SITE" in
            test) export OA_ENTRY_ORIGIN='https://nuochong-company-homepage-test.76gzwtk9sb.workers.dev' ;;
            production) export OA_ENTRY_ORIGIN='https://www.nuochong.net' ;;
            *) exit 1 ;;
          esac
          node scripts/verify-oa-live.mjs
      - if: always()
        run: rm -f ~/.ssh/oa_live_key
