name: OA integration gate
on:
  pull_request:
    branches: [refactor/integration]
permissions:
  contents: read
  checks: read
jobs:
  gate:
    name: OA required gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Wait for all OA checks on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/oa-gate.mjs
