<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>OA 管理员登录 - 诺崇科技</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#17233b;background:radial-gradient(circle at 15% 10%,#e2f7fa,transparent 35%),#f3f7fd}.card{width:min(100%,460px);padding:36px;background:#fff;border:1px solid #dbe4f0;border-radius:24px;box-shadow:0 24px 70px #153b7520}.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:#1b3154;text-decoration:none}.brand img{width:34px;height:34px}h1{font-size:26px;letter-spacing:-.03em;margin:32px 0 10px}p{color:#5d6d85;font-size:14px;line-height:1.8;margin:0 0 22px}label{display:block;font-size:14px;font-weight:650;margin-bottom:8px}input{width:100%;padding:13px 14px;border:1px solid #b9c8da;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#0b57d0;box-shadow:0 0 0 3px #0b57d020}.hint{font-size:13px;color:#667790;margin:8px 0 18px}.error{color:#b42318;margin:0 0 14px;min-height:1.4em}.button{width:100%;border:0;border-radius:10px;padding:13px;color:#fff;background:#0b57d0;font-size:15px;font-weight:650;cursor:pointer}.button:hover{background:#0849b0}.secondary{display:block;text-align:center;margin-top:20px;color:#0b57d0;font-size:14px}.note{margin:24px 0 0;padding-top:18px;border-top:1px solid #e4ebf5;font-size:12px;color:#748399}code{font-family:ui-monospace,monospace}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/"><img src="/logo-mark.svg" alt="">诺崇科技</a>
    <h1>登录 OA 管理员页面</h1>
    <p>请输入管理员提供的启动链接或启动凭据，登录原生 Harness 测试页面。</p>
    <form id="login-form" novalidate>
      <label for="credential">启动链接或凭据</label>
      <input id="credential" type="password" autocomplete="off" spellcheck="false" required>
      <p class="hint">启动链接由管理员获取。凭据仅用于本次登录，不会保存在此页面。</p>
      <p id="error" class="error" role="alert" aria-live="polite"></p>
      <button class="button" type="submit">登录 OA</button>
    </form>
    <noscript>请启用 JavaScript 后使用此登录入口。</noscript>
    <a class="secondary" href="https://www.nuochong.net/oa-test/">已经登录？直接进入 OA</a>
    <p class="note">当前为管理员测试入口。公司员工登录与权限管理仍在规划中。</p>
  </main>
  <script>
    (() => {
      const form = document.getElementById('login-form');
      const input = document.getElementById('credential');
      const error = document.getElementById('error');
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = input.value.trim();
        let token = value;
        if (value.includes('://')) {
          try {
            const url = new URL(value);
            if (url.origin !== 'https://www.nuochong.net' || url.pathname !== '/oa-test/' || url.username || url.password || url.hash || [...url.searchParams.keys()].some(key => key !== 'token') || url.searchParams.getAll('token').length !== 1) throw new Error();
            token = url.searchParams.get('token') || '';
          } catch { error.textContent = '请输入有效的管理员启动链接或凭据。'; return; }
        }
        if (!/^[A-Za-z0-9_-]{20,256}$/.test(token)) { error.textContent = '请输入有效的管理员启动链接或凭据。'; return; }
        const destination = new URL('https://www.nuochong.net/oa-test/');
        destination.searchParams.set('token', token);
        input.value = '';
        window.location.replace(destination.href);
      });
    })();
  </script>
</body>
</html>
