# Include inside the existing www.nuochong.net HTTPS server only.
location = /oa-test {
    return 308 /oa-test/;
}
location ^~ /oa-test/ {
    proxy_pass http://127.0.0.1:3080/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect ~^(/.*)$ /oa-test$1;
    proxy_cookie_path / /oa-test/;
    proxy_cookie_flags ~ secure httponly samesite=lax;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 20m;
    # Native launch credentials appear in queries; never access-log this path.
    access_log off;
    error_log /var/log/nginx/nuochong-oa-test-error.log crit;
}
